# Used when the server already runs nginx on ports 80/443.
# The app listens only on localhost; nginx proxies countpulse.<domain> to it.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:${APP_PORT}:8000"]
    volumes:
      - appdata:/data
volumes:
  appdata:
